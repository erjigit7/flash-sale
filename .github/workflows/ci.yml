name: CI

on:
  push:
  pull_request:

# новый push в ту же ветку отменяет устаревший прогон
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # те же версии, что на машине разработки; полезно видеть в логе при разборе падений
      - name: Versions
        run: |
          docker --version
          docker compose version

      # настоящий Postgres, заглушка оплаты и Mailpit поднимаются сами как зависимости сервиса tests
      - name: Backend e2e tests (docker compose)
        run: docker compose --profile test run --rm --build --use-aliases tests

      - name: Container logs (on failure)
        if: failure()
        run: docker compose --profile test logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose --profile test down -v --remove-orphans
